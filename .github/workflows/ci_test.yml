name: test

on:
  push:
    branches: '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Upgrade pip
        run: |
            python -m pip install --upgrade pip

      - name: Run tests
        run: |
          python -m unittest discover -s test -p "test.py"